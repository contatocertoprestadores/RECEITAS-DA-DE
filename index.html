<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E85D26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fábrica de Salgados - Transforme seus salgados em um negócio lucrativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

tailwind.config={ theme: { extend: { fontFamily: { display:['Playfair Display','serif'], sans:['Inter','sans-serif'] }, colors: { brand:'#E85D26' } } } }

body{font-family:'Inter',system-ui,sans-serif;background:#FFF9F0;max-width:100vw;overflow-x:hidden}

.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}

<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
import React, { useState, useEffect, useRef, useMemo } from 'react';

// ===== TIPOS =====
type Ingrediente = { nome: string; qtd: number; unidade: string; categoria: string };
type Receita = {
  id: string;
  nome: string;
  categoria: string;
  emoji: string;
  gradiente: string;
  descricao: string;
  rendimento: number;
  tempo: string;
  dificuldade: string;
  ingredientes: Ingrediente[];
  modoPreparo: string[];
  montagem: string;
  fritura: string;
  dicasProducao: string;
  dicasVenda: string;
  conservacao: string;
  validade: string;
  vegetariano: boolean;
  gourmet: boolean;
  paraVenda: boolean;
  tipo: 'frito' | 'assado';
};

type Pedido = {
  id: string;
  nome: string;
  whatsapp: string;
  data: string;
  comprovanteBase64: string;
  comprovanteNome: string;
  comprovanteTipo: string;
  status: 'pendente' | 'liberado';
};

// ===== GERAR 100 RECEITAS =====
const categorias = [
  "Salgados tradicionais",
  "Fritos",
  "Assados",
  "Gourmet",
  "Vegetarianos",
  "Para festas",
  "Mini salgados",
  "Econômicos",
  "Para vender",
  "Especiais",
];

const nomesPorCategoria: Record<string, string[]> = {
  "Salgados tradicionais": ["Coxinha de Frango", "Risoles de Carne", "Bolinha de Queijo", "Kibe Clássico", "Esfirra de Carne", "Pastel de Queijo", "Enroladinho de Salsicha", "Croquete de Carne", "Bolinha de Calabresa", "Pastel de Frango Cremoso"],
  "Fritos": ["Coxinha Crocante Extra", "Bolinho de Aipim com Carne", "Pastel Frito Gigante", "Bolinha de Arancini", "Kibe Frito Recheado", "Churros Salgado", "Bolinho de Feijoada", "Coxinha de Jaca", "Bolinho de Bacalhau", "Travesseirinho de Camarão"],
  "Assados": ["Esfirra de Frango Assada", "Empada de Palmito", "Joelho de Queijo e Presunto", "Enroladinho de Queijo Assado", "Esfirra Folhada", "Hambúrguer Assado", "Pastel de Forno Integral", "Bauru de Forno", "Torta de Frango de Copinho", "Pão de Batata Recheado"],
  "Gourmet": ["Coxinha de Costela com Cheddar", "Arancini de Risoto Negro", "Croquete de Pato Confit", "Esfirra de Cordeiro", "Empada de Camarão VG", "Quiche Lorraine Mini", "Bolinha de Brie com Damasco", "Kibe de Pinhão", "Pastel de Lagosta", "Coxinha de Trufas"],
  "Vegetarianos": ["Coxinha de Jaca Veg", "Kibe de Abóbora", "Bolinha de Grão de Bico", "Esfirra de Escarola", "Pastel de Palmito", "Bolinho de Couve-Flor", "Empada de Legumes", "Croquete de Lentilha", "Risoles de Espinafre", "Enroladinho de Tofu"],
  "Para festas": ["Mini Coxinha Festa", "Bolinha de Queijo Festa", "Mini Kibe Festa", "Mini Esfirra Aberta", "Mini Pastel Colorido", "Canapé de Frango", "Vol-au-vent de Camarão", "Barquete de Maionese", "Cestinha de Festa", "Cone Salgado Recheado"],
  "Mini salgados": ["Mini Coxinha 15g", "Mini Risoles 15g", "Mini Bolinha 12g", "Mini Pastel 20g", "Mini Esfirra 18g", "Mini Empada 20g", "Mini Kibe 15g", "Mini Enroladinho 15g", "Mini Croquete 12g", "Mini Churros Salgado"],
  "Econômicos": ["Coxinha Econômica", "Risoles de Soja", "Bolinha de Batata", "Kibe de Arroz", "Pastel de Vento Recheado", "Enroladinho Econômico", "Empada de Massa Podre Barata", "Bolinho de Milho", "Esfirra de Massa de Pão", "Pão com Carne Moída"],
  "Para vender": ["Coxinha 100g Lucrativa", "Pastel de Feira 120g", "Kibe Recheado 90g", "Bolinha Gourmet para Venda", "Empadão de Frango Fatia", "Enroladinho para Lanche", "Esfirra Fechada 80g", "Hambúrguer Caseiro 110g", "Pão de Queijo Recheado", "Croquete de Calabresa 80g"],
  "Especiais": ["Coxinha sem Glúten", "Salgado Low Carb", "Coxinha Fit de Batata Doce", "Esfirra Integral", "Pastel Assado sem Lactose", "Kibe de Quinoa", "Empada Vegana", "Bolinha de Inhame", "Risoles sem Ovo", "Chipa Paraguaia"],
};

const emojis = ["🥟","🧀","🔥","✨","🌱","🎉","🤏","💰","🚀","⭐","🥐","🍗","🥧","🌮"];
const gradientes = [
  "from-[#FFE6C7] to-[#FFC38A]",
  "from-[#FFD6BA] to-[#FF9F6E]",
  "from-[#FFF1C6] to-[#C6A86A]",
  "from-[#FFE0D6] to-[#E85D26]",
  "from-[#D6FFD6] to-[#8BC48A]",
  "from-[#D6E8FF] to-[#8AA8E8]",
  "from-[#FFE6F0] to-[#FF8FAB]",
  "from-[#E6E6FF] to-[#A8A8FF]",
  "from-[#FFF9C0] to-[#E8C84A]",
  "from-[#D0F0FF] to-[#6AC8E8]",
];

function gerarReceitas(): Receita[] {
  const receitas: Receita[] = [];
  let idCounter = 1;
  categorias.forEach((cat, catIdx) => {
    nomesPorCategoria[cat].forEach((nome, idx) => {
      const baseRendimento = [25, 30, 35, 40, 20, 50, 60, 15][idx % 8];
      const tempo = ["45 min", "1h", "1h15", "50 min", "1h30", "40 min"][idx % 6];
      const dificuldade = ["Fácil", "Média", "Média", "Fácil", "Avançada"][idx % 5];
      const isVeg = cat === "Vegetarianos" || nome.toLowerCase().includes("veg") || nome.includes("Jaca") || nome.includes("Abóbora");
      const isGourmet = cat === "Gourmet" || nome.includes("Trufas") || nome.includes("Lagosta") || nome.includes("Costela");
      const isParaVenda = cat === "Para vender" || cat === "Econômicos" || cat === "Mini salgados" || cat === "Salgados tradicionais";
      const tipo: 'frito'|'assado' = cat === "Assados" || cat === "Especiais" || nome.includes("Assado") || nome.includes("Forno") || nome.includes("Empada") ? "assado" : "frito";
      
      const ingredientesBase: Ingrediente[] = [
        { nome: "Farinha de trigo", qtd: 500 + idx*20, unidade: "g", categoria: "Massa" },
        { nome: "Recheio principal", qtd: 300 + catIdx*15, unidade: "g", categoria: "Recheio" },
        { nome: "Caldo de galinha", qtd: 600, unidade: "ml", categoria: "Massa" },
        { nome: "Manteiga", qtd: 50, unidade: "g", categoria: "Massa" },
        { nome: "Queijo muçarela", qtd: isVeg ? 0 : 100, unidade: "g", categoria: "Recheio" },
        { nome: "Cebola picada", qtd: 80, unidade: "g", categoria: "Tempero" },
        { nome: "Óleo para fritura", qtd: 800, unidade: "ml", categoria: "Fritura" },
        { nome: "Farinha de rosca", qtd: 150, unidade: "g", categoria: "Empanar" },
      ].filter(i=>i.qtd>0);

      receitas.push({
        id: `r${idCounter++}`,
        nome,
        categoria: cat,
        emoji: emojis[(catIdx*3 + idx) % emojis.length],
        gradiente: gradientes[(catIdx + idx) % gradientes.length],
        descricao: `${nome} com massa leve e recheio cremoso, ideal para vender e lucrar até 300%.`,
        rendimento: baseRendimento,
        tempo,
        dificuldade,
        ingredientes: ingredientesBase,
        modoPreparo: [
          `Ferva ${600}ml de água com caldo, manteiga e temperos até levantar fervura para base de ${nome}.`,
          `Adicione a farinha de uma vez e mexa vigorosamente até desgrudar da panela, formando massa lisa.`,
          `Sove a massa ainda morna por 3 minutos, cubra e deixe descansar 10 minutos.`,
          `Prepare o recheio refogando cebola e o principal, ajuste sal e finalize cremoso.`,
          `Modele ${baseRendimento} unidades, recheie, feche bem, empane e frite/asse conforme tipo.`,
        ],
        montagem: `Abra porções de 35g, coloque 15g de recheio, modele formato característico de ${nome}.`,
        fritura: tipo === 'frito' ? "Frite em óleo a 180°C por 3-4 min até dourar. Escorra em papel." : "Asse a 200°C por 22-25 min até dourar. Pincele gema para brilho.",
        dicasProducao: "Congele aberto em bandeja por 2h antes de ensacar. Não descongele para fritar.",
        dicasVenda: "Venda em combos: 10 por R$25, 25 por R$55. Destaque 'caseiro' e 'crocante'.",
        conservacao: "Geladeira 3 dias, freezer 90 dias.",
        validade: "3 dias refrigerado, 90 dias congelado cru.",
        vegetariano: isVeg,
        gourmet: isGourmet,
        paraVenda: isParaVenda,
        tipo,
      });
    });
  });
  return receitas;
}

const RECEITAS = gerarReceitas();

export default function App() {
  // ===== ACESSO =====
  const [acessoLiberado, setAcessoLiberado] = useState(() => {
    if (typeof window !== 'undefined') {
      return localStorage.getItem('acessoLiberado') === 'true';
    }
    return false;
  });
  const [toast, setToast] = useState<string | null>(null);
  const [showPixKey] = useState("18991925703");

  // Logo taps
  const tapTimes = useRef<number[]>([]);
  const [showAdmSenha, setShowAdmSenha] = useState(false);
  const [senhaInput, setSenhaInput] = useState("");
  const [admAutenticado, setAdmAutenticado] = useState(false);
  const [showAdmPanel, setShowAdmPanel] = useState(false);

  // Sales form
  const [nome, setNome] = useState("");
  const [whatsapp, setWhatsapp] = useState("");
  const [arquivo, setArquivo] = useState<File | null>(null);
  const [arquivoBase64, setArquivoBase64] = useState("");
  const [arquivoPreview, setArquivoPreview] = useState("");

  // Pedidos
  const [pedidos, setPedidos] = useState<Pedido[]>(() => {
    if (typeof window !== 'undefined') {
      const s = localStorage.getItem('listaPedidos');
      return s ? JSON.parse(s) : [];
    }
    return [];
  });
  const [buscaAdm, setBuscaAdm] = useState("");
  const [verComprovante, setVerComprovante] = useState<Pedido | null>(null);

  // App liberado states
  const [pagina, setPagina] = useState<'inicio'|'receitas'|'calculadora'|'financeiro'|'producao'|'vendas'|'clientes'|'compras'|'config'>('inicio');
  const [showMais, setShowMais] = useState(false);
  const [buscaReceita, setBuscaReceita] = useState("");
  const [filtroCategoria, setFiltroCategoria] = useState<string>("Todas");
  const [filtrosExtras, setFiltrosExtras] = useState({ veg: false, gourmet: false, paraVenda: false, frito: false, assado: false });
  const [favoritos, setFavoritos] = useState<string[]>(() => {
    if (typeof window !== 'undefined') {
      const s = localStorage.getItem('favoritos');
      return s ? JSON.parse(s) : [];
    }
    return [];
  });
  const [receitaSelecionada, setReceitaSelecionada] = useState<Receita | null>(null);

  // Calculadora
  const [calcReceitaId, setCalcReceitaId] = useState<string>(RECEITAS[0].id);
  const [calcQtd, setCalcQtd] = useState(50);
  const [calcUnidade, setCalcUnidade] = useState<'unidades'|'pessoas'>('unidades');
  const [calcPorPessoa, setCalcPorPessoa] = useState(8);
  const [ingredientesEditaveis, setIngredientesEditaveis] = useState<Record<string, number>>({});

  // Financeiro
  const [custos, setCustos] = useState<any[]>(() => {
    const s = localStorage.getItem('custosIngredientes');
    return s ? JSON.parse(s) : [{ id:'1', nome:'Farinha trigo', custo: 6, unidade:'kg', qtdBase:1000 }];
  });
  const [embalagem, setEmbalagem] = useState(() => Number(localStorage.getItem('custoEmbalagem') || 0.15));
  const [gas, setGas] = useState(() => Number(localStorage.getItem('custoGas') || 0.10));
  const [outros, setOutros] = useState(() => Number(localStorage.getItem('custoOutros') || 0.05));
  const [valorHora, setValorHora] = useState(() => Number(localStorage.getItem('valorHora') || 25));
  const [horas, setHoras] = useState(1);
  const [margem, setMargem] = useState(() => Number(localStorage.getItem('margemLucro') || 100));

  // Produção, Vendas, Clientes, Compras
  const [producoes, setProducoes] = useState<any[]>(() => {
    const s = localStorage.getItem('producoes'); return s ? JSON.parse(s) : [];
  });
  const [vendas, setVendas] = useState<any[]>(() => {
    const s = localStorage.getItem('vendas'); return s ? JSON.parse(s) : [];
  });
  const [clientes, setClientes] = useState<any[]>(() => {
    const s = localStorage.getItem('clientes'); return s ? JSON.parse(s) : [];
  });
  const [compras, setCompras] = useState<any[]>(() => {
    const s = localStorage.getItem('compras'); return s ? JSON.parse(s) : [];
  });
  const [novaProducao, setNovaProducao] = useState({ receitaId: RECEITAS[0].id, qtd: 50, data: new Date().toISOString().slice(0,10) });
  const [novaVenda, setNovaVenda] = useState({ produto: RECEITAS[0].nome, qtd: 10, valor: 25, cliente: '', forma: 'Pix', data: new Date().toISOString().slice(0,10) });
  const [novoCliente, setNovoCliente] = useState({ nome:'', endereco:'', whatsapp:'', bairro:'', cidade:'', ref:'', obs:'' });
  const [buscaCliente, setBuscaCliente] = useState("");

  // Config
  const [configPorPessoa, setConfigPorPessoa] = useState(() => Number(localStorage.getItem('salgadosPorPessoa') || 8));

  // Effects persistence
  useEffect(() => { localStorage.setItem('acessoLiberado', String(acessoLiberado)); }, [acessoLiberado]);
  useEffect(() => { localStorage.setItem('listaPedidos', JSON.stringify(pedidos)); }, [pedidos]);
  useEffect(() => { localStorage.setItem('favoritos', JSON.stringify(favoritos)); }, [favoritos]);
  useEffect(() => { localStorage.setItem('custosIngredientes', JSON.stringify(custos)); }, [custos]);
  useEffect(() => { localStorage.setItem('custoEmbalagem', String(embalagem)); }, [embalagem]);
  useEffect(() => { localStorage.setItem('custoGas', String(gas)); }, [gas]);
  useEffect(() => { localStorage.setItem('custoOutros', String(outros)); }, [outros]);
  useEffect(() => { localStorage.setItem('valorHora', String(valorHora)); }, [valorHora]);
  useEffect(() => { localStorage.setItem('margemLucro', String(margem)); }, [margem]);
  useEffect(() => { localStorage.setItem('producoes', JSON.stringify(producoes)); }, [producoes]);
  useEffect(() => { localStorage.setItem('vendas', JSON.stringify(vendas)); }, [vendas]);
  useEffect(() => { localStorage.setItem('clientes', JSON.stringify(clientes)); }, [clientes]);
  useEffect(() => { localStorage.setItem('compras', JSON.stringify(compras)); }, [compras]);
  useEffect(() => { localStorage.setItem('salgadosPorPessoa', String(configPorPessoa)); }, [configPorPessoa]);

  useEffect(() => {
    if (toast) {
      const t = setTimeout(() => setToast(null), 2500);
      return () => clearTimeout(t);
    }
  }, [toast]);

  // Logo tap handler - com feedback para auditoria e 5 toques para ADM
  const handleLogoTap = () => {
    const now = Date.now();
    tapTimes.current = [...tapTimes.current.filter(t => now - t < 3000), now];
    const count = tapTimes.current.length;
    if (count >= 5) {
      tapTimes.current = [];
      setShowAdmSenha(true);
      setToast("Acesso restrito detectado");
    } else {
      // feedback imediato para cada toque, mantém segredo do ADM
      setToast(`Toque ${count} de 5`);
      setTimeout(()=>{ setToast(t=> t && t.startsWith("Toque") ? null : t); }, 800);
    }
  };

  const copiarPix = async () => {
    try {
      await navigator.clipboard.writeText(showPixKey);
      setToast("Chave PIX copiada!");
    } catch {
      // fallback
      const el = document.createElement('textarea');
      el.value = showPixKey;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      setToast("Chave PIX copiada!");
    }
  };

  const handleFileChange = (e: React.ChangeEvent<HTMLInputElement>) => {
    const file = e.target.files?.[0] || null;
    if (!file) return;
    setArquivo(file);
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result as string;
      setArquivoBase64(result);
      if (file.type.startsWith('image/')) {
        setArquivoPreview(result);
      } else {
        setArquivoPreview("");
      }
    };
    reader.readAsDataURL(file);
  };

  const enviarComprovante = () => {
    if (!nome.trim() || !whatsapp.trim()) {
      setToast("Preencha nome e WhatsApp");
      return;
    }
    if (!arquivo) {
      setToast("Selecione o comprovante");
      return;
    }
    const novoPedido: Pedido = {
      id: Date.now().toString(),
      nome: nome.trim(),
      whatsapp: whatsapp.trim().replace(/\D/g,''),
      data: new Date().toLocaleString('pt-BR'),
      comprovanteBase64: arquivoBase64,
      comprovanteNome: arquivo.name,
      comprovanteTipo: arquivo.type,
      status: 'pendente',
    };
    const lista = [novoPedido, ...pedidos];
    setPedidos(lista);
    // abrir whatsapp
    const msg = `Olá! Realizei o pagamento de R$12,90 da Fábrica de Salgados. Nome: ${novoPedido.nome} WhatsApp: ${novoPedido.whatsapp}. Estou enviando o comprovante.`;
    const url = `https://wa.me/5518991488302?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
    setToast("Pedido salvo! Comprovante enviado. Aguarde liberação em até 5 minutos.");
    setNome(""); setWhatsapp(""); setArquivo(null); setArquivoBase64(""); setArquivoPreview("");
  };

  // ADM actions
  const liberarPedido = (pedido: Pedido) => {
    const atualizados = pedidos.map(p => p.id === pedido.id ? { ...p, status: 'liberado' as const } : p);
    setPedidos(atualizados);
    // salvar acessos liberados
    const acessos = JSON.parse(localStorage.getItem('acessosLiberados') || '[]');
    acessos.push({ whatsapp: pedido.whatsapp, nome: pedido.nome, data: new Date().toISOString() });
    localStorage.setItem('acessosLiberados', JSON.stringify(acessos));
    // liberar aparelho atual (simulação multi-usuário: libera aparelho atual)
    setAcessoLiberado(true);
    localStorage.setItem('acessoLiberado', 'true');
    setToast(`Acesso liberado para ${pedido.nome}! Recarregue se necessário.`);
  };

  const bloquearPedido = (pedido: Pedido) => {
    setPedidos(pedidos.map(p => p.id === pedido.id ? { ...p, status: 'pendente' as const } : p));
    setToast("Pedido marcado como pendente");
  };

  const excluirPedido = (id: string) => {
    if (!confirm("Excluir este pedido?")) return;
    setPedidos(pedidos.filter(p => p.id !== id));
  };

  const verificarSenha = () => {
    if (senhaInput === "20112024") {
      setAdmAutenticado(true);
      setShowAdmSenha(false);
      setShowAdmPanel(true);
      setSenhaInput("");
    } else {
      setToast("Senha incorreta");
      setSenhaInput("");
    }
  };

  // Calculadora logic
  const receitaCalc = useMemo(() => RECEITAS.find(r => r.id === calcReceitaId) || RECEITAS[0], [calcReceitaId]);
  const totalUnidadesCalc = calcUnidade === 'unidades' ? calcQtd : calcQtd * calcPorPessoa;
  const fatorCalc = totalUnidadesCalc / (receitaCalc.rendimento || 1);
  const ingredientesCalculados = receitaCalc.ingredientes.map(ing => {
    const base = ingredientesEditaveis[ing.nome] ?? ing.qtd;
    return { ...ing, qtdOriginal: ing.qtd, qtdCalc: base * fatorCalc };
  });

  // Financeiro calc
  const custoIngredientesTotal = custos.reduce((acc, c) => acc + (Number(c.custo) || 0), 0);
  const custoMaoObra = valorHora * horas;
  const custoTotalLote = custoIngredientesTotal + embalagem* (receitaCalc.rendimento) + gas + outros + custoMaoObra;
  const custoPorUnidade = custoTotalLote / (receitaCalc.rendimento || 1);
  const precoSugerido = custoPorUnidade * (1 + margem/100);
  const lucroUnidade = precoSugerido - custoPorUnidade;

  // Dashboard numbers
  const totalProduzido = producoes.reduce((a,b)=>a+(b.qtd||0),0);
  const totalVendido = vendas.reduce((a,b)=>a+(b.qtd||0),0);
  const faturamento = vendas.reduce((a,b)=>a+ (b.valor||0),0);
  const lucroEstimado = faturamento - (totalVendido * custoPorUnidade);

  // Filtros receitas
  const receitasFiltradas = RECEITAS.filter(r => {
    if (filtroCategoria !== "Todas" && r.categoria !== filtroCategoria) return false;
    if (buscaReceita && !r.nome.toLowerCase().includes(buscaReceita.toLowerCase())) return false;
    if (filtrosExtras.veg && !r.vegetariano) return false;
    if (filtrosExtras.gourmet && !r.gourmet) return false;
    if (filtrosExtras.paraVenda && !r.paraVenda) return false;
    if (filtrosExtras.frito && r.tipo !== 'frito') return false;

                </label>
                <label className="grid gap-1.5">
                  <span className="text-[11px] font-bold">MARGEM PADRÃO %</span>
                  <input type="range" min={20} max={400} value={margem} onChange={e=>setMargem(Number(e.target.value))} className="accent-[#E85D26]" />
                  <div className="text-[12px] font-bold">{margem}%</div>
                </label>
              </div>
            </div>

            <div className="bg-white rounded-[24px] p-5 border border-black/5">
              <div className="font-bold">Seus dados ficam salvos no seu celular</div>
              <div className="text-[12px] text-black/60 mt-1">Faça uma cópia de segurança e guarde em lugar seguro</div>
              <div className="mt-4 grid gap-2">
                <button onClick={()=>{
                  const dados = {
                    pedidos, favoritos, custos, producoes, vendas, clientes, compras,
                    config: { configPorPessoa, valorHora, margem, embalagem, gas, outros },
                    acessoLiberado
                  };
                  const blob = new Blob([JSON.stringify(dados)], {type:'application/json'});
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href=url; a.download=`fabrica-salgados-backup-${Date.now()}.json`; a.click();
                  URL.revokeObjectURL(url);
                  setToast("Cópia salva");
                }} className="h-12 rounded-full bg-[#1A1A1A] text-white font-bold text-[12px]">Salvar cópia de segurança</button>

                <label className="h-12 rounded-full border border-black/10 grid place-items-center font-bold text-[12px] cursor-pointer">
                  Restaurar cópia
                  <input type="file" accept="application/json" className="hidden" onChange={e=>{
                    const file = e.target.files?.[0]; if(!file) return;
                    const reader = new FileReader();
                    reader.onload = () => {
                      try {
                        const dados = JSON.parse(reader.result as string);
                        if(dados.pedidos) setPedidos(dados.pedidos);
                        if(dados.favoritos) setFavoritos(dados.favoritos);
                        if(dados.custos) setCustos(dados.custos);
                        if(dados.producoes) setProducoes(dados.producoes);
                        if(dados.vendas) setVendas(dados.vendas);
                        if(dados.clientes) setClientes(dados.clientes);
                        if(dados.compras) setCompras(dados.compras);
                        if(dados.config){
                          setConfigPorPessoa(dados.config.configPorPessoa||8);
                          setValorHora(dados.config.valorHora||25);
                          setMargem(dados.config.margem||100);
                          setEmbalagem(dados.config.embalagem||0.15);
                          setGas(dados.config.gas||0.10);
                          setOutros(dados.config.outros||0.05);
                        }
                        setToast("Cópia restaurada");
                      } catch { setToast("Arquivo inválido"); }
                    };
                    reader.readAsText(file);
                  }} />
                </label>

                <button onClick={()=>{
                  if(!confirm("Apagar TUDO? Esta ação não pode ser desfeita.")) return;
                  localStorage.clear();
                  setPedidos([]); setFavoritos([]); setProducoes([]); setVendas([]); setClientes([]); setCompras([]);
                  setAcessoLiberado(false);
                  setToast("Tudo apagado");
                }} className="h-12 rounded-full bg-red-50 text-red-600 border border-red-200 font-bold text-[12px]">Apagar tudo do aparelho</button>

                <button onClick={()=>{ setAcessoLiberado(false); setToast("Acesso bloqueado neste aparelho"); }} className="h-12 rounded-full bg-[#FFF9F0] border border-black/10 font-bold text-[12px]">Bloquear acesso deste aparelho (teste)</button>
              </div>
            </div>

            <div className="bg-[#1A1A1A] text-white rounded-[24px] p-5">
              <div className="font-bold">Instalar na tela inicial</div>
              <div className="text-[12px] text-white/60 mt-1 leading-5">No iPhone: abra no Safari, toque em Compartilhar e em "Adicionar à Tela de Início". No Android: abra no Chrome, menu ⋮ e "Instalar aplicativo" ou "Adicionar à tela inicial".</div>
            </div>
          </div>
        )}
      </main>

      {/* Bottom nav */}
      <nav className="fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur-xl border-t border-black/5">
        <div className="max-w-7xl mx-auto px-2 h-[84px] flex items-center justify-around">
          {[
            { id:'inicio', l:'Início', i:'🏠' },
            { id:'receitas', l:'Receitas', i:'🥟' },
            { id:'calculadora', l:'Calculadora', i:'🧮' },
            { id:'financeiro', l:'Financeiro', i:'💰' },
            { id:'mais', l:'Mais', i:'⋯' },
          ].map(item=>(
            <button key={item.id} onClick={()=>{ if(item.id==='mais'){ setShowMais(true);} else { setPagina(item.id as any); }}} className={`flex flex-col items-center gap-1 min-w-[56px] ${pagina===item.id ? 'text-[#E85D26]' : 'text-black/50'}`}>
              <div className={`w-8 h-8 rounded-full grid place-items-center text-[16px] ${pagina===item.id ? 'bg-[#E85D26] text-white' : 'bg-black/5'}`}>{item.i}</div>
              <div className="text-[10px] font-bold tracking-wide">{item.l}</div>
            </button>
          ))}
        </div>
      </nav>

      {/* Mais drawer */}
      {showMais && (
        <div className="fixed inset-0 z-40">
          <div className="absolute inset-0 bg-black/40" onClick={()=>setShowMais(false)}></div>
          <div className="absolute bottom-[84px] left-0 right-0 bg-white rounded-t-[28px] p-5 max-w-7xl mx-auto border-t border-black/5 shadow-[0_-10px_40px_rgba(0,0,0,0.15)]">
            <div className="w-10 h-1.5 rounded-full bg-black/10 mx-auto mb-4"></div>
            <div className="grid grid-cols-2 gap-3">
              {[
                { id:'producao', l:'Produção', d:`${producoes.length} lotes`, e:'👨‍🍳' },
                { id:'vendas', l:'Vendas', d:`${vendas.length} vendas`, e:'🧾' },
                { id:'clientes', l:'Clientes', d:`${clientes.length} clientes`, e:'👥' },
                { id:'compras', l:'Compras', d:`${compras.length} itens`, e:'🛒' },
                { id:'config', l:'Configurações', d:'Ajustes e cópia', e:'⚙️' },
              ].map(c=>(
                <button key={c.id} onClick={()=>{ setPagina(c.id as any); setShowMais(false); }} className="text-left bg-[#FFF9F0] rounded-2xl p-4 border border-black/5">
                  <div className="text-[20px]">{c.e}</div>
                  <div className="font-bold text-[13px] mt-1">{c.l}</div>
                  <div className="text-[11px] text-black/50">{c.d}</div>
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* Receita modal */}
      {receitaSelecionada && (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-[#FFF9F0]">
          <div className="sticky top-0 z-10 bg-[#FFF9F0]/90 backdrop-blur-xl border-b border-black/5">
            <div className="max-w-7xl mx-auto px-4 h-[64px] flex items-center justify-between">
              <button onClick={()=>setReceitaSelecionada(null)} className="w-10 h-10 rounded-full bg-white border border-black/10 grid place-items-center">←</button>
              <div className="font-bold text-[14px] truncate max-w-[200px]">{receitaSelecionada.nome}</div>
              <button onClick={()=>{ setFavoritos(f=> f.includes(receitaSelecionada.id) ? f.filter(x=>x!==receitaSelecionada.id) : [...f, receitaSelecionada.id])}} className={`w-10 h-10 rounded-full grid place-items-center border ${favoritos.includes(receitaSelecionada.id) ? 'bg-[#E85D26] text-white border-[#E85D26]' : 'bg-white border-black/10'}`}>♥</button>
            </div>
          </div>
          <div className="max-w-3xl mx-auto px-4 pb-20 pt-4 grid gap-4">
            <div className={`h-[180px] rounded-[28px] bg-gradient-to-br ${receitaSelecionada.gradiente} grid place-items-center text-[64px] relative overflow-hidden`}>
              <span>{receitaSelecionada.emoji}</span>
              <div className="absolute bottom-3 left-3 right-3 flex gap-2">
                <div className="px-3 py-1 rounded-full bg-black text-white text-[11px] font-bold">{receitaSelecionada.categoria}</div>
                <div className="px-3 py-1 rounded-full bg-white text-black text-[11px] font-bold">{receitaSelecionada.tipo}</div>
                {receitaSelecionada.vegetariano && <div className="px-3 py-1 rounded-full bg-green-600 text-white text-[11px] font-bold">Veg</div>}
              </div>
            </div>

            <div className="bg-white rounded-[24px] p-5 border border-black/5">
              <div className="font-display font-bold text-[22px]">{receitaSelecionada.nome}</div>
              <div className="text-[13px] text-black/60 mt-1">{receitaSelecionada.descricao}</div>
              <div className="mt-3 flex gap-2">
                <div className="px-3 py-1 rounded-full bg-[#FFF9F0] border border-black/5 text-[11px] font-bold">{receitaSelecionada.rendimento} unidades</div>
                <div className="px-3 py-1 rounded-full bg-[#FFF9F0] border border-black/5 text-[11px] font-bold">{receitaSelecionada.tempo}</div>
                <div className="px-3 py-1 rounded-full bg-[#FFF9F0] border border-black/5 text-[11px] font-bold">{receitaSelecionada.dificuldade}</div>
              </div>
            </div>

            <div className="bg-white rounded-[24px] p-5 border border-black/5">
              <div className="font-bold">Ingredientes</div>
              <div className="mt-3 grid gap-2">
                {receitaSelecionada.ingredientes.map((ing,i)=>(
                  <div key={i} className="flex justify-between bg-[#FFF9F0] rounded-xl px-4 py-2.5 text-[13px]"><span className="font-semibold">{ing.nome}</span><span className="text-black/60">{ing.qtd}{ing.unidade} • {ing.categoria}</span></div>
                ))}
              </div>
            </div>

            {[
              { t:'Modo de preparo (5 passos)', c: receitaSelecionada.modoPreparo },
              { t:'Montagem', c: [receitaSelecionada.montagem] },
              { t: receitaSelecionada.tipo==='frito' ? 'Fritura' : 'Forno', c: [receitaSelecionada.fritura] },
              { t:'Dicas de produção', c: [receitaSelecionada.dicasProducao] },
              { t:'Dicas de venda', c: [receitaSelecionada.dicasVenda] },
              { t:'Conservação e validade', c: [receitaSelecionada.conservacao, receitaSelecionada.validade] },
            ].map(sec=>(
              <div key={sec.t} className="bg-white rounded-[24px] p-5 border border-black/5">
                <div className="font-bold text-[14px]">{sec.t}</div>
                <div className="mt-2 grid gap-2">
                  {sec.c.map((s, i)=><div key={i} className="text-[13px] leading-6 text-black/70 bg-[#FFF9F0] rounded-xl px-4 py-2.5">{i+1}. {s}</div>)}
                </div>
              </div>
            ))}

            <button onClick={()=>{
              setCalcReceitaId(receitaSelecionada.id);
              setReceitaSelecionada(null);
              setPagina('calculadora');
              window.scrollTo({top:0, behavior:'smooth'});
            }} className="w-full h-[56px] rounded-full bg-[#1A1A1A] text-white font-bold text-[14px]">Calcular esta receita</button>
          </div>
        </div>
      )}

      {/* ADM senha modal (quando já liberado, ainda permite) */}
      {showAdmSenha && (
        <div className="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm grid place-items-center p-4">
          <div className="bg-white rounded-[24px] w-full max-w-[360px] p-6 shadow-2xl">
            <div className="font-display font-bold text-[20px]">Acesso Restrito</div>
            <div className="text-[13px] text-black/60 mt-1">Área administrativa • Digite a senha</div>
            <input autoFocus type="password" value={senhaInput} onChange={e=>setSenhaInput(e.target.value)} placeholder="Senha" className="mt-4 w-full h-12 rounded-full px-5 bg-[#FFF9F0] border border-black/10 outline-none focus:border-[#1A1A1A]" onKeyDown={e=> e.key==='Enter' && verificarSenha()} />
            <div className="mt-4 flex gap-3">
              <button onClick={()=>{setShowAdmSenha(false); setSenhaInput("");}} className="flex-1 h-12 rounded-full border border-black/10 font-bold text-[13px]">Cancelar</button>
              <button onClick={verificarSenha} className="flex-1 h-12 rounded-full bg-[#1A1A1A] text-white font-bold text-[13px]">Entrar</button>
            </div>
          </div>
        </div>
      )}

      {toast && <div className="fixed bottom-[96px] left-1/2 -translate-x-1/2 bg-[#1A1A1A] text-white px-5 py-3 rounded-full text-[13px] font-semibold shadow-xl z-50 max-w-[90%] text-center">{toast}</div>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>

<script>
// PWA Service Worker registration
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
